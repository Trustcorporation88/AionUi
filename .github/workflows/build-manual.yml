name: '🔨 Manual Build'

permissions:
  contents: write
  actions: write

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      branch:
        description: 'Branch to build from'
        required: true
        default: 'main'
        type: string
      skip_code_quality:
        description: 'Skip code quality checks (faster builds for debugging)'
        required: false
        type: boolean
        default: false

env:
  BUN_INSTALL_REGISTRY: 'https://registry.npmjs.org/'
  # Run JavaScript actions on Node.js 24 (GitHub forces this default from 2026-06-16;
  # opting in early silences the Node.js 20 deprecation warnings).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  prepare-matrix:
    name: Prepare Build Matrix
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Generate build matrix
        id: set-matrix
        shell: bash
        run: |
          WINDOWS_X64='{"platform":"windows-x64","os":"windows-2022","command":"node scripts/build-with-builder.js x64 --win --x64","artifact-name":"windows-build-x64","arch":"x64"}'
          MATRIX="{\"include\":[$WINDOWS_X64]}"

          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT
          echo "Generated matrix for Windows x64:"
          echo "$MATRIX" | python3 -m json.tool

  build-pipeline:
    needs: prepare-matrix
    uses: ./.github/workflows/_build-reusable.yml
    with:
      matrix: ${{ needs.prepare-matrix.outputs.matrix }}
      ref: ${{ inputs.branch || 'main' }}
      skip_code_quality: ${{ inputs.skip_code_quality || false }}
      append_commit_hash: true
      upload_installers_only: true
    secrets: inherit
